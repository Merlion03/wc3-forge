name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS (for Wails -nsis installer step)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Make makensis discoverable to the wails build step in this job.
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build (binary + NSIS installer)
        run: wails build -platform windows/amd64 -nsis -clean -ldflags "-s -w"

      - name: Package portable zip
        shell: pwsh
        run: |
          $zip = "wc3-forge-${{ steps.ver.outputs.tag }}-windows-amd64.zip"
          $staging = "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          # Portable bundle: binary + vendored CASC DLLs. Exclude the installer.
          Get-ChildItem build/bin -File |
            Where-Object { $_.Name -notmatch '-installer\.exe$' } |
            Copy-Item -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -Force
          Get-ChildItem $zip | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            wc3-forge-${{ steps.ver.outputs.tag }}-windows-amd64.zip
            build/bin/wc3-forge-amd64-installer.exe
