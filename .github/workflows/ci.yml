name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v6
      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc
        with:
          minimum-size: 8GB
          maximum-size: 16GB
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend type-check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: MCP catalog in sync (gen:tools, fail on drift)
        shell: bash
        run: |
          set -eo pipefail
          cd mcp && npm ci && npm run gen:tools && cd ..
          if ! git diff --exit-code -- internal/mcpserver/tools.json; then
            echo "::error::internal/mcpserver/tools.json is out of sync with mcp/src/tools.ts. Run 'cd mcp && npm run gen:tools' and commit the result."
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...
      - name: Go build
        run: go build ./...

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Go vet
        run: go vet ./...
      - name: Go test (race detector)
        env:
          CGO_ENABLED: 1
        run: go test -race ./...
      - name: Go build
        run: go build ./...
